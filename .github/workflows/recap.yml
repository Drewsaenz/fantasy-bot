name: recap

# Tuesday 8:00 AM Central: the week's recap is Tuesday's morning ping (check skips Tuesday).
# No schedule here on purpose: GitHub's cron queue dropped most firings (Oct 2026), so the Cloudflare
# Worker under trigger/ starts this workflow through the workflow_dispatch API, on time and on /recap.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Sleeper player list (5 MB, fetched at most once a day)
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ steps.date.outputs.today }}

      - name: Weekly recap to Telegram
        run: python fantasy_check.py --mode recap --telegram
        env:
          SLEEPER_CACHE_DIR: .cache
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - if: failure()
        name: Say so in Telegram
        run: bash tools/telegram_fail.sh "weekly recap"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
