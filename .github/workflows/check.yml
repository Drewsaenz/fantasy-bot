name: check

on:
  workflow_dispatch:
  schedule:
    # GitHub delivers scheduled runs late (hours, on a busy day) and sometimes drops one outright,
    # so rather than aiming a narrow window at each slot, fire every hour and let slot_gate.sh decide
    # which Central-time slot the run is standing in for. The cache lock keeps the extra firings from
    # sending twice, and a firing that arrives past a slot's budget warns instead of staying silent.
    # Hourly also means no separate CDT/CST windows to keep in sync.
    #
    # Minute 17, not 0: GitHub queues every repo's scheduled runs together, and the top of the hour
    # is when the whole platform's crons pile up, so :00 is the slowest minute to be delivered.
    - cron: "17 * * * *"
    # The half-hour slots (Sun 11:30 AM and 6:30 PM Central) need a second firing past the half hour.
    - cron: "47 16-23 * * 0"
    - cron: "47 0-2 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: gate
        name: Is a Central-time slot due?
        # One morning report a day at 8:00 Central, plus the slots that sit just before a kickoff.
        # Budgets are per slot: a morning with no games is still worth reading at lunch (600 min),
        # Sunday morning has to beat the noon kickoffs (180), and the pre-kickoff slots are only
        # worth sending while the lineup can still change (60-180). Past its budget a slot warns.
        run: >-
          bash tools/slot_gate.sh
          1-0800:600 2-0800:600 3-0800:600 4-0800:600 5-0800:600 6-0800:600
          0-0800:180 4-1600:180 0-1130:60 0-1830:60

      - if: steps.gate.outputs.slot != ''
        id: lock
        name: Has this slot already been handled?
        uses: actions/cache/restore@v4
        with:
          path: .slot
          key: sent-check-${{ steps.gate.outputs.slot }}

      - id: go
        if: steps.gate.outputs.run == 'true' && steps.lock.outputs.cache-hit != 'true'
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - if: steps.go.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.go.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - if: steps.go.outputs.ok == 'true'
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - if: steps.go.outputs.ok == 'true'
        id: players
        name: Sleeper player list (5 MB, fetched at most once a day)
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ steps.date.outputs.today }}

      - if: steps.go.outputs.ok == 'true'
        name: Lineup check to Telegram
        run: python fantasy_check.py --mode check --telegram
        env:
          SLEEPER_CACHE_DIR: .cache
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Silence is what went unnoticed for four days, so say something rather than nothing.
      - if: steps.gate.outputs.stale == 'true' && steps.lock.outputs.cache-hit != 'true'
        id: warn
        name: Warn that this slot never went out
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ steps.gate.outputs.slot }}
          RUNS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/check.yml
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ No lineup check went out for $SLOT. GitHub ran the job too late for it to be worth sending. Run it by hand: $RUNS_URL"

      # Only after the send succeeded: a failed post leaves the lock open so the next firing retries.
      - if: steps.go.outputs.ok == 'true' || steps.warn.outcome == 'success'
        name: Mark this slot handled
        run: mkdir -p .slot && date -u +%FT%TZ > .slot/sent
      - if: steps.go.outputs.ok == 'true' || steps.warn.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .slot
          key: sent-check-${{ steps.gate.outputs.slot }}

      - if: steps.go.outputs.ok == 'true'
        name: Build dashboard
        run: python fantasy_check.py --mode dashboard --out site/index.html
        env:
          SLEEPER_CACHE_DIR: .cache
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - if: steps.go.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.go.outputs.ok == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
