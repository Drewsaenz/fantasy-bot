name: check

# No schedule here on purpose. GitHub's cron queue delivered about one scheduled run every 2-3 hours
# for this repo (Oct 2026), so timing lives in the Cloudflare Worker under trigger/, which starts this
# workflow through the workflow_dispatch API at each Central-time slot and whenever /check is sent to
# the Telegram bot. Dispatched runs start within seconds.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Sleeper player list (5 MB, fetched at most once a day)
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ steps.date.outputs.today }}

      - name: Lineup check to Telegram
        run: python fantasy_check.py --mode check --telegram
        env:
          SLEEPER_CACHE_DIR: .cache
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Build dashboard
        run: python fantasy_check.py --mode dashboard --out site/index.html
        env:
          SLEEPER_CACHE_DIR: .cache
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - if: failure()
        name: Say so in Telegram
        run: bash tools/telegram_fail.sh "lineup check"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
