name: check

on:
  workflow_dispatch:
  schedule:
    # Central time slots. GitHub cron is UTC, so each slot is listed for both CDT (UTC-5) and CST (UTC-6);
    # the gate step keeps only the run that lands in the right local window.
    - cron: "0 13,14 * * 3"   # Wed 8:00 AM  (after waivers)
    - cron: "0 21,22 * * 4"   # Thu 4:00 PM  (before TNF)
    - cron: "0 15,16 * * 0"   # Sun 10:00 AM (injury check)
    - cron: "30 16,17 * * 0"  # Sun 11:30 AM (last inactives)
    - cron: "30 23 * * 0"     # Sun 6:30 PM CDT
    - cron: "30 0 * * 1"      # Sun 6:30 PM CST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: gate
        name: Is it one of the scheduled Central-time slots?
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          now=$(TZ=America/Chicago date +%u-%H:%M)   # 1=Mon .. 7=Sun
          case "$now" in
            3-08:[0-2]*|4-16:[0-2]*|7-10:[0-2]*|7-11:[3-5]*|7-18:[3-5]*) echo run=true >> "$GITHUB_OUTPUT" ;;
            *) echo "skip: $now Central is the other DST offset"; echo run=false >> "$GITHUB_OUTPUT" ;;
          esac

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - if: steps.gate.outputs.run == 'true'
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        id: players
        name: Sleeper player list (5 MB, fetched at most once a day)
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ steps.date.outputs.today }}

      - if: steps.gate.outputs.run == 'true'
        name: Lineup check to Telegram
        run: python fantasy_check.py --mode check --telegram
        env:
          SLEEPER_CACHE_DIR: .cache
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - if: steps.gate.outputs.run == 'true'
        name: Build dashboard
        run: python fantasy_check.py --mode dashboard --out site/index.html
        env:
          SLEEPER_CACHE_DIR: .cache
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.gate.outputs.run == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
