name: waivers

on:
  workflow_dispatch:
  schedule:
    # Tue 8:00 PM Central. Fires hourly across both DST offsets and the lateness budget below, so a
    # delayed or dropped firing still lands; slot_gate.sh picks the due slot and the cache lock stops
    # a second firing from re-sending.
    - cron: "0 1-12 * * 3"

permissions:
  contents: read

concurrency:
  group: waivers
  cancel-in-progress: false

jobs:
  waivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: gate
        name: Is a Central-time slot due?
        # Eight hours: waiver targets are still actionable overnight, up to Wednesday processing.
        env:
          MAX_LATE_MIN: 480
        run: bash tools/slot_gate.sh 2-2000

      - if: steps.gate.outputs.slot != ''
        id: lock
        name: Has this slot already been handled?
        uses: actions/cache/restore@v4
        with:
          path: .slot
          key: sent-waivers-${{ steps.gate.outputs.slot }}

      - id: go
        if: steps.gate.outputs.run == 'true' && steps.lock.outputs.cache-hit != 'true'
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - if: steps.go.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.go.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - if: steps.go.outputs.ok == 'true'
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - if: steps.go.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ steps.date.outputs.today }}

      - if: steps.go.outputs.ok == 'true'
        name: Waiver targets and trade ideas to Telegram
        run: python fantasy_check.py --mode waivers --telegram
        env:
          SLEEPER_CACHE_DIR: .cache
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - if: steps.gate.outputs.stale == 'true' && steps.lock.outputs.cache-hit != 'true'
        id: warn
        name: Warn that this slot never went out
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ steps.gate.outputs.slot }}
          RUNS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/waivers.yml
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ No waiver report went out for $SLOT. GitHub ran the job too late for it to be worth sending. Run it by hand: $RUNS_URL"

      - if: steps.go.outputs.ok == 'true' || steps.warn.outcome == 'success'
        name: Mark this slot handled
        run: mkdir -p .slot && date -u +%FT%TZ > .slot/sent
      - if: steps.go.outputs.ok == 'true' || steps.warn.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .slot
          key: sent-waivers-${{ steps.gate.outputs.slot }}
